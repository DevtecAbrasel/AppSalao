server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name appsalao.abrasel.xyz;

    include /etc/nginx/certs/abrasel.xyz.conf;

    # TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    # O redirect HTTP -> HTTPS ja e tratado por um bloco catch-all/wildcard
    # existente no Nginx do servidor (certificado wildcard abrasel.xyz),
    # por isso nao e duplicado aqui.

    # Requisicoes /api/* -> container Docker da API. A barra final em
    # proxy_pass remove o prefixo /api antes de repassar (as rotas reais
    # da API nao possuem esse prefixo). Precedencia sobre location / por
    # ser o prefixo mais especifico (Nginx escolhe por prefixo mais longo).
    location /api/ {
        proxy_pass http://127.0.0.1:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App_Web: arquivos estaticos gerados por `npx expo export --platform web`
    # em app/dist. try_files com fallback para index.html implementa o
    # comportamento de SPA (rotas do lado do cliente sempre retornam 200).
    location / {
        root /var/www/AppSalao/app/dist;
        try_files $uri $uri/ /index.html;
    }
}
