server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name appsalao.abrasel.xyz;

    include /etc/nginx/certs/abrasel.xyz.conf;

    # TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    # O redirect HTTP -> HTTPS ja e tratado por um bloco catch-all/wildcard
    # existente no Nginx do servidor (certificado wildcard abrasel.xyz),
    # por isso nao e duplicado aqui.

    # Cache de GET /events e /events/:id: com milhares de pessoas no evento
    # consultando a agenda ao mesmo tempo numa VM de 1 vCPU, esse e o
    # endpoint mais lido de toda a API e o conteudo muda raramente (so
    # quando um ADMIN edita a programacao). Cachear aqui, no Nginx, evita
    # que a esmagadora maioria dessas leituras chegue a tocar no processo
    # Node/Postgres.
    #
    # So GET/HEAD sao cacheaveis por padrao no Nginx, entao POST/PUT/DELETE
    # de /events (usados so pelo ADMIN) nunca sao servidos do cache -
    # continuam indo direto para a API. Precisa vir ANTES de location
    # /api/ para ganhar por ser o prefixo mais especifico.
    #
    # A chave de cache inclui $http_x_api_key: sem isso, uma resposta bem
    # sucedida cacheada seria servida de volta mesmo para quem manda a
    # chave errada ou nenhuma chave, pulando por completo a checagem que
    # o middleware requireAppKey faz na API. Como so existe uma chave
    # valida em uso (APP_API_KEY), isso nao reduz o cache hit no trafego
    # real, so impede esse desvio.
    #
    # proxy_cache_valid especifica so o codigo 200: respostas de erro
    # (ex.: 401 de chave invalida) nunca sao cacheadas, entao continuam
    # sempre sendo avaliadas pela API.
    location /api/events {
        proxy_cache appsalao_events_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri$http_x_api_key";
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://127.0.0.1:3333/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Requisicoes /api/* -> container Docker da API. A barra final em
    # proxy_pass remove o prefixo /api antes de repassar (as rotas reais
    # da API nao possuem esse prefixo). Precedencia sobre location / por
    # ser o prefixo mais especifico (Nginx escolhe por prefixo mais longo).
    #
    # NAO cachear aqui: cobre rotas por usuario (favoritos, notificacoes,
    # /auth/me) cujo conteudo e diferente para cada pessoa. Cachear por
    # URI misturaria a resposta de um usuario com a de outro.
    location /api/ {
        proxy_pass http://127.0.0.1:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App_Web: arquivos estaticos gerados por `npx expo export --platform web`
    # em app/dist. try_files com fallback para index.html implementa o
    # comportamento de SPA (rotas do lado do cliente sempre retornam 200).
    location / {
        root /var/www/AppSalao/app/dist;
        try_files $uri $uri/ /index.html;
    }
}