<!DOCTYPE html>
<!--
  Template do HTML gerado por `expo export --platform web`.

  Por que existe: o caminho oficial da Expo para mexer no <head> é o
  `+html.tsx`, que exige Expo Router — este app usa React Navigation. A Expo
  também aceita um `public/index.html` como template e injeta o <script> do
  bundle e o <link> do favicon nele, que é o que acontece aqui.

  O reset abaixo é o mesmo que a Expo gera por padrão (recomendação do
  react-native-web); mexer nele quebra a altura da tela.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>Salão Abrasel</title>
    <meta
      name="description"
      content="Programação, favoritos, avisos e mapa do Salão Abrasel 2026."
    />

    <!-- Instalação na tela inicial. O manifesto atende Android/Chrome e,
         desde o iOS 16.4, também o Safari; as metas "apple-" continuam
         necessárias para as versões anteriores do iOS. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#15243C" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default" deixa a barra de status opaca com texto escuro. Usar
         "black-translucent" faria o conteúdo subir por baixo da barra, o que
         exigiria tratar safe area em todas as telas. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Salão Abrasel" />

    <!-- A marca aparece antes do bundle: quem abre o app instalado vê a tela
         de abertura do evento, não um retângulo branco. -->
    <link rel="preload" as="image" href="/logo-salao.png" />

    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Id diferente do da <div> de propósito: com os dois iguais,
         getElementById devolveria esta folha de estilo, e quem fosse tirar a
         abertura da tela acabaria mexendo no CSS dela. -->
    <style id="estilo-abertura">
      /* Tela de abertura.
         Aberto da tela inicial, o app é uma janela sem barra de navegador: o
         que houver aqui entre o toque no ícone e o React montar é tudo o que a
         pessoa vê. Em branco, parece um site lento; com a marca, parece o app
         do evento abrindo. Por isso mora no HTML, e não num componente — um
         componente só existiria depois do bundle, que é justamente a espera
         que isto cobre. */
      body {
        background: #15243c;
      }
      #abertura {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #15243c;
        /* Sem transição na entrada: a marca precisa já estar lá no primeiro
           quadro. A transição serve só para a saída. */
        transition: opacity 260ms ease-out;
      }
      #abertura img {
        width: min(62vw, 300px);
        height: auto;
      }
      #abertura.saindo {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #abertura {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Você precisa habilitar o JavaScript para usar este app.</noscript>
    <div id="root"></div>

    <div id="abertura">
      <img src="/logo-salao.png" alt="Salão Abrasel" />
    </div>

    <script>
      // Quem tira a abertura é o app (src/lib/telaDeAbertura.ts), assim que
      // tem uma tela de verdade para mostrar. Isto aqui é só a rede de
      // segurança: se o bundle não carregar, a marca não pode ficar para
      // sempre na frente do <noscript> e de qualquer erro na tela.
      //
      // 20s e não 12s: medido, o app leva ~10s para abrir num link de
      // demonstração por túnel, e no 4G de um centro de eventos pode levar
      // mais. Com 12s a rede de segurança disparava em cima de um
      // carregamento que ia dar certo, devolvendo justamente o branco que ela
      // existe para evitar. Este número é o "desistiu", não o "demorou".
      setTimeout(function () {
        var abertura = document.getElementById("abertura");
        if (!abertura || abertura.classList.contains("saindo")) return;
        abertura.classList.add("saindo");
        setTimeout(function () {
          if (abertura.parentNode) abertura.parentNode.removeChild(abertura);
        }, 400);
      }, 20000);
    </script>

    <script>
      // Registro fora do bundle: assim o service worker não entra no grafo de
      // módulos do app e o registro acontece mesmo se o bundle demorar.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {
            // Falha aqui só custa o botão de instalar no Android; o app
            // funciona igual, então não vale interromper o carregamento.
          });
        });
      }
    </script>
  </body>
</html>
